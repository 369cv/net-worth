<title>Net Worth App</title>
<meta name="description" content="Net Worth — track spending, investments, forecasts, equity, estate and taxes in one place.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: Origin-style app frame — grey sidebar (Track / Services), greeting header, 2-column card grid (main + rail). Net Worth brand tokens. */
:root{--bg:#f4f4f2;--side:#ededeb;--card:#ffffff;--line:#e3e3e0;--ink:#141416;--mute:#626268;--violet:#6b5cf0;--blue:#3d7bff;--green:#1f9d63;--red:#d84f4f;--soft:#f0effe;
--serif:'Instrument Serif',Georgia,serif;--sans:Inter,system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
:root[data-mode="dark"]{--bg:#0e0f11;--side:#131416;--card:#17181b;--line:rgba(255,255,255,.08);--ink:#f2f2f0;--mute:#a6a6ab;--violet:#8f83ff;--blue:#5b8fff;--green:#3fcf8e;--red:#f06a6a;--soft:#1f1d33;color-scheme:dark}
:root:not([data-mode="dark"]){color-scheme:light}
*{box-sizing:border-box}html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.app{display:grid;grid-template-columns:216px 1fr;min-height:100%}
/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:8px;padding:2px 8px 18px;font-family:var(--serif);font-size:21px}
.logo svg{width:22px;height:22px}
.sec{font:10px var(--mono);letter-spacing:.14em;color:var(--mute);padding:14px 10px 6px}
.nv{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--ink);opacity:.82}
.nv svg{width:16px;height:16px;flex:none}
.nv:hover{background:color-mix(in srgb,var(--ink) 6%,transparent);opacity:1}.nv.on{background:color-mix(in srgb,var(--ink) 9%,transparent);opacity:1;font-weight:500}
.ask{all:unset;cursor:pointer;margin-top:auto;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--violet);font-weight:500}
/* main */
main{min-width:0;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.top h1{font:400 26px/1.1 var(--sans);letter-spacing:-.01em;margin:0}
.icons{display:flex;gap:8px}
.ib{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.ib svg{width:16px;height:16px}
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;color:var(--mute);white-space:nowrap}.tab.on{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.col{display:grid;gap:16px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0}
.lbl{font:10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;gap:6px;align-items:center}
.plus{all:unset;cursor:pointer;width:26px;height:26px;border:1px solid var(--line);border-radius:7px;display:grid;place-items:center;color:var(--violet)}
.cb{padding:12px 16px 16px}
.val{font:500 28px/1.15 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.d{font-size:12px;font-variant-numeric:tabular-nums}.up{color:var(--green)}.dn{color:var(--red)}.mute{color:var(--mute)}
.btn{all:unset;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:6px;min-height:40px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-weight:500;box-sizing:border-box}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 30%,transparent)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.w{width:100%}
.ranges{display:flex;justify-content:center;gap:4px;margin:6px 0 12px}
.rg{all:unset;cursor:pointer;padding:4px 10px;border-radius:7px;font-size:12px;color:var(--mute)}.rg.on{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink);font-weight:500}
svg.chart{width:100%;height:auto;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:1px solid var(--line);border-radius:6px;padding:4px 5px;min-height:38px;font-size:10px;color:var(--mute);font-variant-numeric:tabular-nums}
.day.today{border-color:var(--violet)}.day.sp{background:var(--blue);color:#fff;border-color:var(--blue)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.list{display:grid}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.av{width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--violet);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.empty{display:grid;justify-items:center;gap:8px;text-align:center;padding:18px 8px;color:var(--mute)}
.empty svg{width:22px;height:22px;color:var(--violet)}
.prog{height:6px;border-radius:6px;background:color-mix(in srgb,var(--ink) 8%,transparent);overflow:hidden}.prog i{display:block;height:100%;background:var(--green);border-radius:6px}
.hero{background:linear-gradient(135deg,#2b2370,#3d7bff);color:#fff;border:0}
.hero .lbl{color:rgba(255,255,255,.75)}
.serif{font-family:var(--serif);font-size:24px;line-height:1.1}
.steps{display:grid;gap:6px;margin-top:10px}
.st{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:13px}
.st .bx{width:16px;height:16px;border-radius:5px;border:1.5px solid rgba(255,255,255,.7);display:grid;place-items:center;flex:none}
.st.done{opacity:.6;text-decoration:line-through}.st.done .bx{background:#fff;color:#2b2370}
/* modal + drawer */
.ov{position:fixed;inset:0;background:rgba(10,10,14,.42);display:grid;place-items:center;z-index:30;padding:16px}
.mod{background:var(--card);border:1px solid var(--line);border-radius:18px;width:min(520px,100%);max-height:88vh;overflow:auto}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mb{padding:16px 18px;display:grid;gap:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:14px;box-sizing:border-box}
.tile:hover{border-color:var(--violet)}
.tile .ti{width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--ink) 6%,transparent);display:grid;place-items:center}
.tile .ti svg{width:16px;height:16px}
.tile.wide{grid-column:1/-1}
label{font-size:12px;color:var(--mute);display:grid;gap:4px}
input,select{min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 12px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{all:unset;cursor:pointer;padding:6px 12px;border-radius:999px;background:var(--soft);color:var(--violet);font-size:12px}
.note{font-size:12px;color:var(--mute);text-align:center}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:400}
.num{text-align:right;font-variant-numeric:tabular-nums}
.x{all:unset;cursor:pointer;padding:4px;color:var(--mute)}
@media(max-width:980px){.grid{grid-template-columns:1fr}}
@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;z-index:10;padding:8px max(12px,env(safe-area-inset-left,0px))}.logo,.sec{display:none}.ask{margin:0;padding:7px 12px;white-space:nowrap}.split,.tiles{grid-template-columns:1fr}.icons .ib:nth-child(n+2){display:none}}

/* ONBOARDING — motion-first. Split auth (persistent showcase), centered steps, space connect. Only transform/opacity animate. */
.ob{min-height:100vh;background:var(--card);display:flex;flex-direction:column}
.split2{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;gap:16px;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.authl{display:grid;place-items:center;padding:24px 8px}
.authf{width:min(340px,100%);display:grid;gap:12px;text-align:center}
.mk{justify-self:center;width:30px;height:30px}
.hl{font:400 clamp(44px,5vw,60px)/.98 var(--serif);letter-spacing:-.02em}.hl em{font-style:italic}
.sub2{font:400 26px/1.1 var(--serif)}
.sso{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sso svg{width:16px;height:16px}
.or{font-size:11px;color:var(--mute)}
.legal{font-size:11px;color:var(--mute);line-height:1.5}.legal a,.authf a{color:inherit;text-decoration:underline}
.fld{position:relative;text-align:left}.fld input{padding-top:18px;min-height:48px;transition:border-color .2s,box-shadow .2s}
.fld input:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--violet) 14%,transparent)}
.fld span{position:absolute;left:12px;top:6px;font-size:10px;color:var(--mute)}
.eye{all:unset;cursor:pointer;position:absolute;right:10px;top:15px;color:var(--mute)}.eye svg{width:16px;height:16px}
.rules{display:grid;gap:4px;text-align:left;font-size:12px}
.rules span{display:flex;gap:6px;align-items:center;color:var(--mute);transition:color .25s}
.rules span b{width:14px;height:14px;border-radius:50%;display:grid;place-items:center;font-size:9px;border:1px solid currentColor;transition:transform .3s cubic-bezier(.3,1.6,.5,1),background .25s}
.rules .ok{color:var(--green)}.rules .ok b{background:var(--green);color:#fff;border-color:var(--green);transform:scale(1.12)}.rules .no{color:var(--red)}
.meter{display:flex;justify-content:space-between;align-items:center;font-size:11px;min-height:14px}
.bars{display:flex;gap:3px}.bars i{width:22px;height:3px;border-radius:3px;background:var(--line);transition:background .3s,transform .3s;transform-origin:left}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* showcase panel */
.stars{border-radius:20px;position:relative;overflow:hidden;color:#fff;display:grid;place-items:center;padding:40px 24px;background:radial-gradient(120% 70% at 50% 115%,#6c8fb3 0%,#233650 32%,#0b1020 66%,#070a14 100%);isolation:isolate}
.sky{position:absolute;inset:-10%;pointer-events:none}
.sky i{position:absolute;border-radius:50%;background:#fff;animation:tw var(--d,4s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.shoot{position:absolute;top:18%;left:-20%;width:140px;height:1.5px;background:linear-gradient(90deg,transparent,#fff);transform:rotate(-18deg);opacity:0;animation:shoot 7s ease-in 1.2s infinite}
@keyframes shoot{0%{transform:translate(0,0) rotate(-18deg);opacity:0}4%{opacity:1}14%{transform:translate(620px,-200px) rotate(-18deg);opacity:0}100%{opacity:0}}
.horizon{position:absolute;left:-20%;right:-20%;bottom:-62%;height:80%;border-radius:50%;background:radial-gradient(closest-side,rgba(150,190,230,.55),rgba(80,120,170,.15) 70%,transparent);animation:breathe 9s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-12px) scale(1.03)}}
.show{position:relative;display:grid;gap:22px;justify-items:center;text-align:center;z-index:1}
.tag{font:400 clamp(30px,3vw,40px)/1.08 var(--serif);letter-spacing:-.01em}
.glass{width:min(340px,100%);border:1px solid rgba(255,255,255,.18);background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));backdrop-filter:blur(10px);border-radius:18px;padding:16px;text-align:left;box-shadow:0 30px 60px rgba(0,0,0,.35);animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.glass .gl{font:9px var(--mono);letter-spacing:.16em;opacity:.65}
.glass svg.gc{width:100%;height:90px;margin-top:6px;overflow:visible}
.gc .ln{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 2.2s cubic-bezier(.6,0,.2,1) .5s forwards}
.gc .ar{opacity:0;animation:fadein 1.2s ease 1.6s forwards}
.gc .dt{opacity:0;animation:pop .5s cubic-bezier(.3,1.6,.5,1) 2.5s forwards;transform-origin:center;transform-box:fill-box}
@keyframes idraw{to{stroke-dashoffset:0}}@keyframes fadeup{from{opacity:0;transform:translateY(6px)}}@keyframes fadein{to{opacity:1}}@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.ticks{display:flex;justify-content:space-between;font:9px var(--mono);opacity:.5;margin-top:4px}
.gplus{width:22px;height:22px;border-radius:7px;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center}
/* top bar + steps */
.obtop{display:flex;justify-content:space-between;align-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.obtop .logo{padding:0;font-size:19px}
.sm{all:unset;cursor:pointer;font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;transition:background .2s,transform .15s}.sm:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}.sm:active{transform:scale(.95)}
.step{flex:1;display:grid;justify-items:center;padding:56px 16px 24px;align-content:start}
.step .in{width:min(360px,100%);display:grid;gap:10px}
.step h2{font:400 32px/1.1 var(--serif);text-align:center;margin:0;text-wrap:balance}
.step .lead{text-align:center;color:var(--mute);margin:-2px 0 8px}
.opt{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;box-sizing:border-box;transition:border-color .2s,background .2s,transform .2s cubic-bezier(.3,1.4,.5,1)}
.opt:hover{border-color:color-mix(in srgb,var(--ink) 35%,transparent);transform:translateX(3px)}.opt:active{transform:scale(.98)}
.opt.on{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.opt svg{width:16px;height:16px;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}.opt.on svg{transform:scale(1.2) rotate(-8deg);color:var(--violet)}
.btn{transition:transform .15s,background .2s,opacity .25s,box-shadow .2s}.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.pri:hover{box-shadow:0 8px 20px color-mix(in srgb,var(--ink) 25%,transparent)}
.btn[disabled]{opacity:.35;pointer-events:none}
.foot{text-align:center;font-size:11px;padding:14px;border-top:1px solid var(--line)}.foot a{color:inherit;opacity:.7;text-decoration:underline}
.promo{border-radius:14px;padding:24px;text-align:center;color:#fff;background:linear-gradient(120deg,#6b5cf0,#3d7bff,#3fcf8e,#6b5cf0);background-size:300% 300%;animation:hue 10s ease infinite}
@keyframes hue{50%{background-position:100% 50%}}
.how{display:grid;gap:14px}.how>div{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:13px;text-align:left}.how b{display:block;font-weight:500}
.how .ck{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}.how .ck svg{width:12px;height:12px}
/* connect (space) */
.space{background:#04060c;color:#fff;position:relative;overflow:hidden}
.space .obtop{border-color:rgba(255,255,255,.08);position:relative;z-index:2}.space .sm{border-color:rgba(255,255,255,.25)}.space .foot{border-color:rgba(255,255,255,.08);position:relative;z-index:2}
.earth{position:absolute;left:50%;bottom:-118vh;width:170vh;height:170vh;margin-left:-85vh;border-radius:50%;background:radial-gradient(circle at 50% 8%,#7fb2e6 0%,#2f6aa8 9%,#123a66 22%,#071a33 40%,#04060c 60%);box-shadow:0 -10px 80px rgba(110,170,240,.35);animation:rise 1.6s cubic-bezier(.2,.8,.2,1) both,spin 120s linear infinite}
@keyframes rise{from{transform:translateY(80px);opacity:0}}@keyframes spin{to{rotate:360deg}}
.space .step{position:relative;z-index:1}
.orbit{display:grid;grid-template-columns:repeat(7,46px);gap:12px;justify-content:center;margin:22px 0}
.bub{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.45);opacity:0;animation:bpop .6s cubic-bezier(.3,1.6,.5,1) forwards,bob 4.5s ease-in-out infinite;animation-delay:calc(var(--i)*45ms + .25s),calc(var(--i)*170ms);transition:transform .25s}
.bub:hover{transform:scale(1.15)!important}
@keyframes bpop{from{opacity:0;scale:.2}to{opacity:1;scale:1}}@keyframes bob{50%{translate:0 -6px}}
.bub{border:0;padding:0;cursor:pointer}
[hidden]{display:none!important}
.day{font-size:10px;line-height:1.25;min-height:40px}

.ask{all:unset;cursor:pointer;margin-top:auto;display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--violet);font:500 13px var(--sans);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.aim{width:min(560px,100%)!important;padding:0}.aim .mb{padding:0}
.aiw{display:grid;grid-template-rows:auto 1fr auto auto;min-height:420px;max-height:80vh}
.aihead{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}.aihead svg{width:16px;height:16px}
.aibody{overflow:auto;padding:18px;display:grid;gap:10px;align-content:start}
.aiintro{display:grid;justify-items:center;gap:14px;text-align:center;padding:22px 0}
.aisp{color:var(--violet)}.aisp svg{width:22px;height:22px;animation:twinkle 2.4s ease-in-out infinite}
.aiti{font:400 30px/1.1 var(--serif);color:#4a4a50}.aiti em{font-style:italic}
.aitip{display:flex;justify-content:space-between;align-items:center;margin:0 14px 10px;padding:9px 12px;border-radius:10px;background:#dff4f1;color:#22524c;font-size:12px}.aitip svg{width:14px;height:14px}
.aiin{display:flex;gap:8px;align-items:center;margin:0 14px 14px;padding:6px 6px 6px 12px;border:1px solid var(--line);border-radius:12px}.aiin input{border:0;background:none;min-height:34px;padding:0}.aiin input:focus{outline:0}
.aisend{all:unset;cursor:pointer;width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}.aisend svg{width:15px;height:15px}
.aim-u{justify-self:end;background:var(--ink);color:var(--bg);padding:9px 13px;border-radius:14px 14px 4px 14px;max-width:80%;animation:rise2 .35s both}
.aim-a{justify-self:start;background:color-mix(in srgb,var(--ink) 5%,transparent);padding:10px 13px;border-radius:14px 14px 14px 4px;max-width:88%;line-height:1.55;animation:rise2 .35s both}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:bob .9s ease-in-out infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}

.side{gap:1px}.nv{font:500 13.5px/1.2 var(--sans);color:#3a3a3f;padding:8px 10px;transition:background .2s,color .2s}
.nv svg{width:17px;height:17px;stroke-width:1.7;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.nv:hover svg{transform:translateX(2px) scale(1.08)}.nv.on svg{color:var(--violet)}
.nv.on{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px var(--line)}
.sec{font:500 10px var(--mono);letter-spacing:.16em;color:#8b8b90}
.ask{font:500 13px var(--sans);transition:transform .2s,box-shadow .2s}.ask:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(107,92,240,.18)}.ask svg{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{50%{transform:rotate(18deg) scale(1.15)}}
.top h1{font:500 24px/1.1 var(--sans);letter-spacing:-.015em}

 <p>Gold has become a hot topic in 2026, with experts clustering around $4,000-$5,000 per ounce by year-end, though it recently corrected from a spike near $5,600 earlier this year. Whether it's “good” depends on what role you want it to play in your financial strategy.</p>
 <p>${S.risk?`Based on your ${S.risk.toLowerCase()} risk profile, I'll frame this for your situation.`:"Since you haven't completed your risk profile assessment yet, I can explain the concepts educationally without personalizing to your specific situation."} All investments carry risk, and gold is no exception.</p>
 <h4>The case for gold</h4><p>Gold typically serves three main purposes in a portfolio:</p><ul><li>${b('Inflation and currency hedge')}: With global debt at $340 trillion (3-4x GDP), gold protects against currency weakness and purchasing power erosion. It historically holds value when paper currencies don't.</li><li>${b('Safe haven during volatility')}: When stocks and bonds fall together, gold often holds steady or rises.</li><li>${b('Diversification')}: Gold's low correlation to stocks can smooth a portfolio's ups and downs.</li></ul>
 <h4>The case against gold</h4><ul><li>${b('No income')}: Gold pays no dividends or interest, so the opportunity cost adds up significantly.</li><li>${b('Volatility and timing risk')}: That recent drop from $5,600 shows how quickly sentiment shifts. Gold is sensitive to US dollar strength, economic growth surprises, and positioning resets.</li><li>${b('Limited long-term growth')}: Since 1971, gold has preserved purchasing power but hasn't matched stock market wealth creation. It's about protection, not aggressive growth.</li></ul>

 const d=miniModal('Sign in',`<form id="sif" style="display:grid;gap:10px"><div class="fld"><span>E-mail</span><input id="sie" type="email" required autocomplete="email"></div><div class="fld"><span>Password</span><input id="sip" type="password" required autocomplete="current-password"></div><div id="sierr" class="d dn" aria-live="polite"></div><div class="mmact"><button type="button" class="btn ghost2" data-forgot>Forgot password?</button><button class="btn pri">Sign in</button></div></form>`);
 d.querySelector('#sie').focus();d.querySelector('[data-forgot]').onclick=()=>{const v=d.querySelector('#sie').value;d.querySelector('#sierr').textContent=v?'':'Enter your e-mail first.';if(v){d._close();toast('ok','Check your email',`We sent a reset link to ${v}.`)}};
 d.querySelector('#sif').onsubmit=ev=>{ev.preventDefault();let acct=null;try{acct=JSON.parse(localStorage.getItem('nw-member')||'null')}catch{}const em=d.querySelector('#sie').value.trim().toLowerCase(),pw=d.querySelector('#sip').value;
  if(!acct||acct.email!==em){d.querySelector('#sierr').textContent='No account found with that e-mail. Sign up instead.';return}
  if(acct.pw!==pw){d.querySelector('#sierr').textContent='That password is incorrect.';return}
  S.user={...acct.user,onboarded:true};S.ob.step='done';save();d._close();render();toast('ok','Welcome back',`Signed in as ${acct.user.name||em}.`)}},true);
/* Apple / Google: confirm details, then continue the journey */
document.addEventListener('click',e=>{const b=e.target.closest('[data-sso]');if(!b)return;e.stopImmediatePropagation();const prov=b.dataset.sso;
 const d=miniModal(`Continue with ${prov}`,`<form id="ssf" style="display:grid;gap:10px"><div class="d mute">Confirm the details we'll use for your account.</div><div class="fld"><span>Your full legal name</span><input id="ssn" required autocomplete="name"></div><div class="fld"><span>E-mail</span><input id="sse" type="email" required autocomplete="email" value="${esc(S.ob.email||'')}"></div><div class="mmact"><button type="button" class="btn ghost2" data-mclose>Cancel</button><button class="btn pri">Continue</button></div></form>`);
 d.querySelector('#ssn').focus();d.querySelector('#ssf').onsubmit=ev=>{ev.preventDefault();S.ob.name=d.querySelector('#ssn').value.trim();S.ob.email=d.querySelector('#sse').value.trim();S.ob.pw='';S.ob.sso=prov;save();d._close();go('refer')}},true);

/* ===================== SPENDING — Overview · Breakdown & budget · Transactions · Recurring · Reports · AI budget builder · Daily market brief ===================== */
const CATS={Shopping:['#f26b3a','bag'],'Drinks & dining':['#f5a623','cup'],'Childcare & education':['#1fb6c9','book'],'Auto & transport':['#b6452c','car'],Entertainment:['#7b6cf6','film'],'OTT Subscription':['#5bc0eb','tv'],Groceries:['#1d6b52','cart'],'Travel & vacation':['#1e6fa8','plane'],Healthcare:['#e86fb8','heart'],'Personal care':['#2f6b22','user'],'Everything else':['#b9b4f5','dots'],Other:['#c9a227','dots']};
const CI={bag:'M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0',cup:'M17 8h1a4 4 0 0 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z',book:'M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5zM4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5',car:'M5 17h14l-1.5-6h-11zM7 17v2M17 17v2M7 11l1-4h8l1 4',film:'M2 6h20v12H2zM7 6v12M17 6v12',tv:'M2 7h20v13H2zM17 2l-5 5-5-5',cart:'M3 3h2l2.4 12h11.2L21 7H6M9 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM18 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2z',plane:'M2 16l20-6-2-2-8 3-5-6-2 1 3 7-4 2-2-1z',heart:'M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z',user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',dots:'M5 12h.01M12 12h.01M19 12h.01'};
const catIc=(n,s=26)=>{const [c,i]=CATS[n]||CATS.Other;return`<span class="cic" style="width:${s}px;height:${s}px;background:${c}"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${CI[i]}"/></svg></span>`};
const TXCAT={Taobao:'Shopping',Grab:'Auto & transport','Geo Adventure Indonesia':'Travel & vacation'};
const SPI={chart:'M3 3v18h18M7 14l4-4 4 4 5-6',cal:'M4 6h16v14H4zM4 10h16M9 3v4M15 3v4',pen:'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z',chev:'M6 9l6 6 6-6',l:'M15 18l-6-6 6-6',r:'M9 18l6-6-6-6',bars:'M6 20V10M12 20V4M18 20v-6',flow:'M3 6c8 0 10 12 18 12M3 18c8 0 10-12 18-12',zero:'M12 3a7 9 0 1 0 0 18 7 9 0 0 0 0-18z',check:'M20 6L9 17l-5-5',spark:'M12 2c.6 4.8 2.7 7.4 8 8.5v1c-5.3 1.1-7.4 3.7-8 8.5h-1c-.6-4.8-2.7-7.4-8-8.5v-1c5.3-1.1 7.4-3.7 8-8.5z',info:'M12 16v-4M12 8h.01M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z',x:'M18 6L6 18M6 6l12 12'};
const si=(k,w=1.7)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${SPI[k]}"/></svg>`;
/* reference fixtures: add Geo Adventure Indonesia (previous month) */
const _etx=ensureTx;ensureTx=function(){_etx();if(S.tx&&S.tx.length&&!S.tx.some(t=>t.id==='r5')){const y=now.getFullYear(),m=now.getMonth();S.tx.push({ref:1,id:'r5',date:new Date(y,m-1,13).toISOString().slice(0,10),name:'Geo Adventure Indonesia',cat:'Travel',icon:'plane',amount:291.78});save()}};
const mKey=d=>d.toISOString().slice(0,7);
const txIn=(ym)=>(ensureTx(),(S.tx||[]).filter(t=>t.date.startsWith(ym)));
const spendIn=ym=>txIn(ym).filter(t=>t.amount>0&&!t.hidden).reduce((s,t)=>s+t.amount,0);
const incomeIn=ym=>Math.abs(txIn(ym).filter(t=>t.amount<0&&!t.hidden&&t.cat==='Income').reduce((s,t)=>s+t.amount,0))||0;
let byCat=ym=>{const m={};txIn(ym).filter(t=>t.amount>0&&!t.hidden).forEach(t=>{const c=TXCAT[t.name]||t.cat||'Other';m[c]=(m[c]||0)+t.amount});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const monthName=(d,s)=>d.toLocaleString('en-US',{month:s?'short':'long'});
const selMonth=()=>{const o=S.spMonth||0;return new Date(now.getFullYear(),now.getMonth()+o,1)};

/* ---------- charts ---------- */
function cumChart(){const d=now,ym=mKey(new Date(d.getFullYear(),d.getMonth(),1)),pv=new Date(d.getFullYear(),d.getMonth()-1,1),pym=mKey(pv),N=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
 const cum=(ym2,upto)=>{let c=0;const by={};txIn(ym2).filter(t=>t.amount>0&&!t.hidden).forEach(t=>{const k=+t.date.slice(8,10);by[k]=(by[k]||0)+t.amount});return Array.from({length:upto},(_,i)=>c+=by[i+1]||0)};
 const cur=cum(ym,d.getDate()),prev=cum(pym,N),bud=S.bud?.total||0,mx=Math.max(1,...cur,...prev,bud)*1.1,W=600,H=200,x=i=>i*(W)/(N-1),y=v=>H-14-v/mx*(H-30);
 const pth=a=>a.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join('');
 return`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="cg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d9bff" stop-opacity=".3"/><stop offset="1" stop-color="#3d9bff" stop-opacity="0"/></linearGradient></defs>
 ${bud?`<line x1="0" x2="${W}" y1="${y(bud)}" y2="${y(bud)}" stroke="#c9c9cd" stroke-dasharray="4 4"/><text x="4" y="${y(bud)-5}" font-size="10" fill="var(--mute)">${usd(bud)} Budget</text>`:''}
 ${S.cmp!=='none'?`<path d="${pth(prev)}" fill="none" stroke="#a9a9ae" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="${x(N-1)}" cy="${y(prev.at(-1))}" r="3" fill="#a9a9ae"/>`:''}
 <path class="ar2" d="${pth(cur)}L${x(cur.length-1)} ${H-14}L0 ${H-14}Z" fill="url(#cg3)"/><path class="sl3" d="${pth(cur)}" fill="none" stroke="#3d9bff" stroke-width="2"/><circle class="dt2" cx="${x(cur.length-1)}" cy="${y(cur.at(-1))}" r="4" fill="#3d9bff"/>
 ${[1,8,15,22,29].filter(t=>t<=N).map(t=>`<text x="${x(t-1)}" y="${H-1}" font-size="10" fill="var(--mute)" text-anchor="${t===1?'start':'middle'}">${String(t).padStart(2,'0')}</text>`).join('')}</svg>`}
function donut(cats,total,label){const R=54,C=2*Math.PI*R;let off=0;const segs=total?cats.map(([n,v])=>{const l=v/total*C,s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${(CATS[n]||CATS.Other)[0]}" stroke-width="10" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" class="dseg"/>`;off+=l;return s}).join(''):`<circle r="${R}" cx="70" cy="70" fill="none" stroke="#ececee" stroke-width="10"/>`;
 return`<div class="donut"><svg viewBox="0 0 140 140">${segs}</svg><div class="dc"><b>${usd(total)}</b><span>${label}</span></div></div>`}
function gauge(pct,val,sub,ghost){const R=60,L=Math.PI*R,f=Math.min(1,pct/100);return`<div class="gauge2 ${ghost?'ghost':''}"><svg viewBox="0 0 150 90"><path d="M15 80 A60 60 0 0 1 135 80" fill="none" stroke="#ececee" stroke-width="12" stroke-linecap="round"/><path class="garc" style="--L:${L};--o:${L*(1-f)}" d="M15 80 A60 60 0 0 1 135 80" fill="none" stroke="${ghost?'#8a8a90':'#4f8a1e'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L*(1-f)}"/></svg><div class="gc2"><span class="d mute">${pct.toFixed(1).replace('.0','')}%</span><b>${val}</b><span class="d mute">${sub}</span></div></div>`}
function monthStrip(){const sel=S.spMonth||0,cells=[];for(let o=-11;o<=0;o++){const d=new Date(now.getFullYear(),now.getMonth()+o,1),v=spendIn(mKey(d)),inc=incomeIn(mKey(d));cells.push({o,d,v,inc})}const mx=Math.max(1,...cells.map(c=>c.v));
 return`<div class="mstrip"><button class="x" data-mnav="-1" aria-label="Previous">${si('l')}</button><div class="mcells">${cells.map(c=>`<button class="mc ${c.o===sel?'on':''}" data-mo="${c.o}" data-tip="${monthName(c.d)} ${c.d.getFullYear()}|${usd2(c.inc)}|-${usd2(c.v)}|${c.inc-c.v<0?'-':''}${usd2(Math.abs(c.inc-c.v))}"><i style="height:${c.v?Math.max(6,c.v/mx*34):2}px;${c.v?'':'background:#e3e3e6'}"></i><span>${monthName(c.d,1)}${c.d.getFullYear()!==now.getFullYear()?"'"+String(c.d.getFullYear()).slice(2):''}</span></button>`).join('')}</div><button class="x" data-mnav="1" aria-label="Next" ${sel>=0?'disabled':''}>${si('r')}</button></div>`}

/* ---------- cards ---------- */
const sCard=(label,body,{act='',cls=''}={})=>`<section class="card ${cls}"><div class="ch"><span class="lbl">${label}</span><span style="display:flex;gap:6px">${act}<button class="plus spk" data-act="ask" aria-label="Ask">${SPK}</button></span></div><div class="cb">${body}</div></section>`;
const latest=()=>{const tx=(ensureTx(),S.tx||[]);return tx.length?`<div class="list">${tx.slice(0,6).map(txRow).join('')}</div>`:`<div class="empty2">${si('cal')}<div><b>No transactions yet</b><span>Connect a bank or card to see your transactions here.</span></div><button class="btn sm3" data-act="add">Connect account</button></div>`};
let upcoming=()=>{const days=['SUN','MON','TUE','WED','THU','FRI','SAT'],st=new Date(now);st.setDate(now.getDate()-now.getDay());const rec=S.recurring||[];
 return`<div class="upc"><div class="upg">${days.map(d=>`<i>${d}</i>`).join('')}${Array.from({length:14},(_,i)=>{const d=new Date(st);d.setDate(st.getDate()+i);const it=rec.find(r=>r.day===d.getDate());return`<span class="${d.toDateString()===now.toDateString()?'today':''} ${d<now&&d.toDateString()!==now.toDateString()?'past':''}">${d.getDate()}${it?`<em style="background:${(CATS[it.cat]||CATS.Other)[0]}"></em><small>${usd2(it.amount)}</small>`:''}</span>`}).join('')}</div>${rec.length?'':`<div class="upempty">Add your recurring bills and subscriptions to see what's coming up.</div>`}</div>`};
function catList(ym,total,limit=5){const c=byCat(ym),names=Object.keys(CATS).filter(n=>!['Other','Everything else','OTT Subscription'].includes(n)),rows=[...c.map(x=>x[0]),...names.filter(n=>!c.some(x=>x[0]===n))].slice(0,S.catAll?99:limit);
 return rows.map(n=>{const v=(c.find(x=>x[0]===n)||[0,0])[1];return`<div class="cli2">${catIc(n)}<div><div>${n}</div><div class="d mute">${total?Math.round(v/total*100):0}% of expenses</div></div><b>${usd(v)}</b></div>`}).join('')}
function budgetRail(){const b=S.bud,sp=spendIn(mKey(now));if(!b)return`<div class="bempty">${gauge(40,'$800','$2,000 budget',1)}<div class="d" style="font-size:14px;color:var(--ink)">Create your budget</div><div class="d mute" style="max-width:30ch">Create a monthly budget to stay on top of your spending and keep your finances on track</div><button class="btn pri sm3" data-aibudget>${si('pen')} Create budget</button></div>`;
 const pct=sp/b.total*100;return`${gauge(pct,usd(sp)+' <span class="d mute">ⓘ</span>',usd(b.total)+' budget')}<button class="lnk2" data-editbud style="justify-self:center">Edit budget ${si('pen')}</button><div class="ebar"><span class="cic" style="background:#b9b4f5;width:22px;height:22px"></span><span>Everything else</span><span class="d"><b>${usd(sp)}</b> of ${usd(b.total)}<br><span class="mute">${pct.toFixed(1)}%</span></span></div><button class="btn w" data-tab="Breakdown & budget" data-btab="Budget">See more</button>`}

/* ---------- views ---------- */
const TABS=['Overview','Breakdown & budget','Transactions','Recurring','Reports'];
V.spending=function(){const tab=S.tab&&TABS.includes(S.tab)?S.tab:'Overview',ym=mKey(now),sp=spendIn(ym);
 const tabs=`<div class="tabs">${TABS.map(t=>`<button class="tab ${tab===t?'on':''}" data-tab="${t}">${t}</button>`).join('')}</div>`;
 if(tab==='Overview'){const cats=byCat(ym);return tabs+`<div class="grid"><div class="col">
  ${sCard('Spend this month',`<div class="spt"><div><div class="val">${usd(sp)}</div><div class="d mute"><i class="lg" style="background:#3d9bff"></i>${monthName(now)}</div></div><div class="cmp"><button class="selb2" data-cmpmenu>··· ${S.cmp==='none'?'No comparison':'vs '+monthName(new Date(now.getFullYear(),now.getMonth()-1,1))} ${si('chev')}</button></div></div>${S.spView==='cal'?`<div style="margin-top:12px">${calendar()}</div>`:cumChart()}`,{act:`<span class="seg2"><button class="${S.spView!=='cal'?'on':''}" data-spv="chart" aria-label="Chart view">${si('chart')}</button><button class="${S.spView==='cal'?'on':''}" data-spv="cal" aria-label="Calendar view">${si('cal')}</button></span>`})}
  <div class="split">${sCard('Latest transactions ›',latest())}${sCard('Upcoming transactions ›',upcoming())}</div></div>
  <div class="col">${S.done.hideAIB?'':`<section class="card aib2" data-aibudget><div class="ch"><span class="lbl">More from Net Worth</span><button class="x" data-hide="hideAIB" aria-label="Dismiss">${si('x')}</button></div><div class="cb"><div class="rs">Build a budget with AI</div><div class="d" style="opacity:.85">AI Budget Builder creates a smart budget based on your real spending in seconds.</div></div></section>`}
  <section class="card"><div class="ch"><span class="lbl">Category breakdown</span><button class="plus spk" data-act="ask">${SPK}</button></div><div class="ctabs">${['Expenses','Budget'].map(t=>`<button class="${(S.railTab||'Expenses')===t?'on':''}" data-rtab="${t}">${t}</button>`).join('')}</div><div class="cb">${(S.railTab||'Expenses')==='Expenses'?(sp?donut(cats,sp,'Spent this month')+`<div class="cl2">${catList(ym,sp,5)}</div>`:`<div class="empty2">${si('zero')}<div><b>No spending yet</b><span>Your category breakdown appears after your first purchase this month.</span></div></div>`):`<div class="brail">${budgetRail()}</div>`}</div></section>
  ${sCard('Income this month ›',incomeIn(ym)?`<div class="d mute">Received</div><div class="val">${usd(incomeIn(ym))}</div>`:`<div class="d mute" style="margin-bottom:8px">Next upcoming income</div><div class="empty2" style="padding:10px"><div><span>No upcoming income detected yet.</span></div></div>`)}</div></div>`}
 if(tab==='Breakdown & budget'){const m=selMonth(),k=mKey(m),s2=spendIn(k),inc=incomeIn(k),cats=byCat(k),bt=S.btab||'Expenses',big=txIn(k).filter(t=>t.amount>0&&!t.hidden).sort((a,b)=>b.amount-a.amount),freq={};txIn(k).filter(t=>t.amount>0&&!t.hidden).forEach(t=>freq[t.name]=(freq[t.name]||0)+1);const fq=Object.entries(freq).sort((a,b)=>b[1]-a[1]);
  const exp=s2?`${donut(cats,s2,'Spent this month')}<div class="vb"><span class="d mute">View by</span><button class="selb2" data-viewby>${S.viewBy||'Category'} ${si('chev')}</button></div><table class="btab"><thead><tr><th>Category</th><th class="num">Amount spent ↓</th><th class="num">% of expenses</th><th class="num">Filter change ⇅</th></tr></thead><tbody>${(S.catAll?[...cats,...expCats().map(c=>c.name).filter(n=>!cats.some(x=>x[0]===n)).map(n=>[n,0])]:cats.slice(0,5)).map(([n,v])=>`<tr data-catd="${n}"><td><span style="display:flex;gap:10px;align-items:center">${catIc(n,24)}${n}</span></td><td class="num">${usd(v)}</td><td class="num">${Math.round(v/s2*100)}%</td><td class="num"><span class="pill3">0% ▾</span></td></tr>`).join('')}</tbody></table>${!S.catAll?'<button class="btn w" data-catall>Show all</button>':''}`:`<div class="empty2">${si('zero')}<div><b>No expenses in ${monthName(m)}</b><span>Pick another month or connect more accounts.</span></div></div>`;
  const bud=!S.bud?`<div class="bempty big">${gauge(40,'$800','$2,000 budget',1)}<div style="font-size:14px">Create your budget</div><div class="d mute" style="max-width:32ch">Create a monthly budget to stay on top of your spending and keep your finances on track</div><button class="btn pri sm3" data-aibudget>${si('pen')} Create budget</button></div>`:
   `${gauge(s2/S.bud.total*100,usd(s2),usd(S.bud.total)+' budget')}<div class="vb" style="justify-content:space-between"><button class="btn sm3" data-editbud>${si('pen')} Edit budget</button><span style="display:flex;gap:8px;align-items:center"><span class="d mute">View by</span><button class="selb2">All budget items ${si('chev')}</button></span></div>
   <table class="btab"><thead><tr><th>Category &amp; group</th><th>Amount spent &amp; upcoming ⓘ ↓</th><th class="num">Budget ⇅</th><th class="num">Available ⇅</th></tr></thead><tbody>${[...S.bud.cats,{name:'Everything else',limit:Math.max(0,S.bud.total-S.bud.cats.reduce((a,c)=>a+c.limit,0))}].map(c=>{const v=(cats.find(x=>x[0]===c.name)||[0,0])[1],w=c.limit?Math.min(100,v/c.limit*100):0;return`<tr><td><span style="display:flex;gap:10px;align-items:center">${catIc(c.name,24)}${c.name}</span></td><td><span class="bline"><b>${usd(v)}</b><i><u style="width:${w}%;background:${(CATS[c.name]||CATS.Other)[0]}"></u></i></span></td><td class="num">${usd(c.limit)}</td><td class="num ${c.limit-v<0?'dn':''}">${usd(c.limit-v)}</td></tr>`}).join('')}</tbody></table>`;
  const incv=inc?`<div class="val">${usd(inc)}</div>`:`<div class="empty2">${si('zero')}<div><b>No income in ${monthName(m)}</b><span>Income from paychecks and transfers shows up here.</span></div></div>`;
  return tabs+`<div class="grid"><div class="col"><section class="card"><div class="ch"><span class="lbl">Time period</span><button class="selb2" data-period>${S.period||'Monthly'} ${si('chev')}</button></div><div class="cb">${monthStrip()}</div></section>
  <section class="card"><div class="ch"><span class="lbl">Category breakdown</span><button class="plus" data-mancat aria-label="Manage categories">${si('pen')}</button></div><div class="ctabs big">${['Expenses','Budget','Income'].map(t=>`<button class="${bt===t?'on':''}" data-btab="${t}">${t}</button>`).join('')}</div><div class="cb">${bt==='Expenses'?exp:bt==='Budget'?bud:incv}</div></section></div>
  <div class="col">${sCard('Cash flow',`<div class="cf"><div class="row3"><span>Income</span><span>${usd2(inc)}</span></div><div class="cfb"><u style="width:${inc?100:0}%"></u></div><div class="row3"><span>Expenses</span><span>-${usd2(s2)}</span></div><div class="cfb"><u style="width:${s2?100:0}%;background:#1e9bf0"></u></div><div class="row3" style="border-top:1px solid var(--line);padding-top:10px"><span>Net Cash Flow</span><span>${inc-s2<0?'-':''}${usd2(Math.abs(inc-s2))}</span></div></div>`)}

function repChart(ms,rv){const W=600,H=220,mx=Math.max(1,...ms.map(m=>Math.max(m.inc,m.exp))),bw=W/ms.length,y=v=>H-24-v/mx*(H-40);

 return`<svg class="chart" viewBox="0 0 ${W} ${H}">${[0,.5,1].map(f=>`<line x1="0" x2="${W}" y1="${y(mx*f)}" y2="${y(mx*f)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${W-2}" y="${y(mx*f)-3}" font-size="9" text-anchor="end" fill="var(--mute)">${usd(mx*f)}</text>`).join('')}${ms.map((m,i)=>{const x=i*bw+bw/2;return`<rect class="rbar" x="${x-14}" width="12" y="${y(m.inc)}" height="${H-24-y(m.inc)}" fill="#9fd0f7" rx="2"/><rect class="rbar" x="${x}" width="12" y="${y(m.exp)}" height="${H-24-y(m.exp)}" fill="#1e9bf0" rx="2"/><text x="${x}" y="${H-6}" font-size="10" text-anchor="middle" fill="var(--mute)">${monthName(m.d,1)}</text>`}).join('')}</svg>`}
function sankey(ms){const all={};ms.forEach(m=>byCat(mKey(m.d)).forEach(([n,v])=>all[n]=(all[n]||0)+v));const rows=Object.entries(all).sort((a,b)=>b[1]-a[1]),tot=rows.reduce((s,r)=>s+r[1],0)||1,W=600,H=Math.max(200,rows.length*56);let yy=10;
 return`<svg class="chart" viewBox="0 0 ${W} ${H}"><rect x="250" y="10" width="10" height="${H-20}" fill="#9bc73a" rx="2"/>${rows.map(([n,v])=>{const h=Math.max(6,(H-20-rows.length*12)*v/tot),c=(CATS[n]||CATS.Other)[0],y0=10+(H-20)*(ms.length?0:0),out=`<path class="sk" d="M260 ${yy+h/2+0} C380 ${yy+h/2} 420 ${yy+h/2} 540 ${yy+h/2}" stroke="${c}" stroke-opacity=".25" stroke-width="${h}" fill="none"/><rect x="540" y="${yy}" width="10" height="${h}" fill="${c}" rx="2"/><text x="530" y="${yy+h/2-2}" font-size="10" text-anchor="end" fill="var(--ink)">${n}</text><text x="530" y="${yy+h/2+10}" font-size="9" text-anchor="end" fill="var(--mute)">${usd2(v)} (${(v/tot*100).toFixed(2)}%)</text>`;yy+=h+12;return out}).join('')}<path d="M20 ${H/2} C120 ${H/2} 150 ${H/2} 250 ${H/2}" stroke="#9bc73a" stroke-opacity=".3" stroke-width="40" fill="none"/><text x="20" y="${H/2-26}" font-size="10" fill="var(--ink)">Spending</text><text x="20" y="${H/2-14}" font-size="9" fill="var(--mute)">${usd2(tot)}</text></svg>`}

  <div class="sprow"><div class="spm"><button class="btn w" data-spmode>${P.mode} ${si('chev')}</button>${d._menu?`<div class="spmenu"><button data-spm="Custom split">Custom split</button><button data-spm="Equal split">Equal split</button></div>`:''}</div><button class="btn w" data-spadd>Add split ${ti('plus')}</button></div>
  ${P.rows.map((r,i)=>`<div class="spcard">${i?`<button class="x sprm" data-sprm="${i}" aria-label="Remove split">${ti('minus')}</button>`:''}<button class="selb spcat" data-scat="${i}">${catIc(r.c,20)}<span>${esc(r.c)}</span>${si('chev')}</button><div class="fld money ${r.amt!==''&&!valid(r)||r.err?'err':''}"><span>Amount</span><b>$</b><input data-spa="${i}" inputmode="decimal" value="${esc(r.amt)}" ${P.mode==='Equal split'?'readonly':''}></div>${(r.amt!==''&&!valid(r))||r.err?'<div class="ferr">Amount must be a valid number</div>':''}<div class="row3"><span>Hide transaction</span><button type="button" class="tog ${r.hide?'on':''}" data-sph="${i}" role="switch"><i></i></button></div></div>`).join('')}
  <div class="spsum ${Math.abs(sum-orig)<0.005?'ok':''}">${usd2(sum)} of ${usd2(orig)} assigned${Math.abs(sum-orig)<0.005?'':` · ${usd2(Math.abs(orig-sum))} ${sum<orig?'left':'over'}`}</div>

  if(el.closest('[data-spmode]')){d._menu=!d._menu;return draw()}const sm=el.closest('[data-spm]');if(sm){P.mode=sm.dataset.spm;d._menu=0;if(P.mode==='Equal split')equal();return draw()}

 d.addEventListener('input',e=>{const a=e.target.closest('[data-spa]');if(!a)return;const i=+a.dataset.spa,p=a.selectionStart;P.rows[i].amt=a.value.replace(/[^\d.]/g,'');P.rows[i].err=false;draw();const j=d.querySelector(`[data-spa="${i}"]`);j.focus();j.setSelectionRange(p,p)})}

function rangeCal(d,F,after){document.querySelectorAll('.rcal').forEach(x=>x.remove());let base=new Date(F.from?F.from+'T12:00':Date.now());base=new Date(base.getFullYear(),base.getMonth()-(F.from?0:1),1);let a=F.from||null,b=F.to||null;const c=document.createElement('div');c.className='rcal';d.querySelector('.drb').append(c);

function bulkEdit(ids){const C={},d=drawer('','','bedr');let view='main';const N=ids.length,lbl=`Editing ${N} transaction${N>1?'s':''}`;

  review:()=>`<div class="becard"><span class="lbl">${lbl}</span>${ids.map(id=>{const t=S.tx.find(x=>x.id===id);return`<div class="revr">${catIc(C.cat||txCat(t),22)}<div><div>${esc(C.merch||t.name)}</div><div class="d mute">${new Date(t.date+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}${C.desc?' · '+esc(C.desc):''}</div></div>${C.rev==='Mark all as unreviewed'||(!C.rev&&!t.reviewed)?'<i class="udot"></i>':''}<span>${usd(Math.abs(t.amount))}</span><button class="cb2 ${pending.skip?.includes(id)?'':'on'}" data-bskip="${id}" aria-label="Include ${esc(t.name)}"></button></div>`}).join('')}</div><div style="display:flex;justify-content:flex-end"><button class="btn pri sm3" data-bconfirm>Confirm changes</button></div>`};

function otpBox(o,onDone){const ins=[...o.querySelectorAll('.otp input')];ins.forEach((i,k)=>{i.oninput=()=>{i.value=i.value.replace(/\D/g,'').slice(-1);if(i.value&&ins[k+1])ins[k+1].focus();if(ins.every(x=>x.value))onDone(ins.map(x=>x.value).join(''),ins)};i.onkeydown=e=>{if(e.key==='Backspace'&&!i.value&&ins[k-1])ins[k-1].focus()};i.onpaste=e=>{const t=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);if(t.length===6){e.preventDefault();t.split('').forEach((c,j)=>ins[j].value=c);onDone(t,ins)}}});ins[0].focus()}

 const pl=P.pl,ss=P.session,notes=P.notes||[];
 return `<div class="grid"><div class="col">${card('Your planner',`<div class="fprow"><span class="fpav">${pl.n.split(' ').map(x=>x[0]).join('')}</span><div><b>${pl.n}</b><div class="mute">${pl.t} · ${pl.f.join(', ')}</div></div><button class="btn ghost2" data-fpchange>Change</button></div>`,{plus:false})}
 ${card('Session',ss?`<div class="fprow"><div><b>${fpFmt(ss.d)} · ${ss.t}</b><div class="mute">45-minute video call · ${P.goals.join(', ')}</div></div><button class="btn ghost2" data-fpbook>Reschedule</button><button class="btn ghost2" data-fpcancel>Cancel</button></div>`:`<div class="empty"><div>No session booked yet.</div><button class="btn" data-fpbook>Book a session</button></div>`,{plus:false})}
 ${card('Notes for your planner',`${notes.length?notes.map((n,i)=>`<div class="fprow fpnote"><div>${esc2(n)}</div><button class="btn ghost2" data-fpnedit="${i}">Edit</button><button class="btn ghost2" data-fpndel="${i}">Delete</button></div>`).join(''):`<div class="mute" style="padding:6px 0 10px">Add questions you want to cover.</div>`}<button class="btn ghost2" data-fpnadd>Add note</button>`,{plus:false})}</div></div>`}
const esc2=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fpMatch(){const g=(S.plan&&S.plan.goals)||[];const d=miniModal('Get matched',`<p class="mute" style="margin:0 0 12px;font-size:13px">What do you want help with?</p><div class="fpchips">${FPG.map(x=>`<label class="fpchip"><input type="checkbox" value="${x}" ${g.includes(x)?'checked':''}>${x}</label>`).join('')}</div><div class="mmact"><button class="btn ghost2" data-mclose>Cancel</button><button class="btn" data-fpgo>Find my planner</button></div>`);
 d.querySelector('[data-fpgo]').onclick=()=>{const sel=[...d.querySelectorAll('input:checked')].map(x=>x.value);if(!sel.length)return toast('err','Pick at least one goal','',2200);const pl=FPS.map(p=>({p,s:p.f.filter(f=>sel.includes(f)).length})).sort((a,b)=>b.s-a.s)[0].p;S.plan={...(S.plan||{}),goals:sel,pl,notes:(S.plan&&S.plan.notes)||[]};save();d._close();render();toast('ok','Matched with '+pl.n,'',2200)}}
function fpBook(){const P=S.plan,days=fpDays(),times=['9:00 AM','11:30 AM','2:00 PM','4:30 PM'];let sd=P.session?.d&&days.includes(P.session.d)?P.session.d:days[0],st=P.session?.t||'';
 const d=miniModal(P.session?'Reschedule':'Book a session',`<div class="lbl" style="margin-bottom:6px">Day</div><div class="fpchips" data-fpd>${days.map(x=>`<button class="fpchip${x===sd?' on':''}" data-v="${x}">${fpFmt(x)}</button>`).join('')}</div><div class="lbl" style="margin:14px 0 6px">Time</div><div class="fpchips" data-fpt>${times.map(x=>`<button class="fpchip${x===st?' on':''}" data-v="${x}">${x}</button>`).join('')}</div><div class="mmact"><button class="btn ghost2" data-mclose>Cancel</button><button class="btn" data-fpok>Confirm</button></div>`);
 d.addEventListener('click',e=>{const c=e.target.closest('.fpchip');if(!c)return;const w=c.parentElement;w.querySelectorAll('.fpchip').forEach(x=>x.classList.toggle('on',x===c));if(w.dataset.fpd!==undefined)sd=c.dataset.v;else st=c.dataset.v});
 d.querySelector('[data-fpok]').onclick=()=>{if(!st)return toast('err','Pick a time','',2000);const re=!!P.session;P.session={d:sd,t:st};save();d._close();render();toast('ok',re?'Session rescheduled':'Session booked',fpFmt(sd)+' · '+st,2600)}}
function fpNote(i){const P=S.plan,v=i==null?'':P.notes[i];const d=miniModal(i==null?'Add note':'Edit note',`<label class="fld"><span>Note</span><input id="fpn" value="${esc2(v)}" maxlength="200"></label><div class="mmact"><button class="btn ghost2" data-mclose>Cancel</button><button class="btn" data-fpsave>Save</button></div>`);const inp=d.querySelector('#fpn');inp.focus();
 const go=()=>{const t=inp.value.trim();if(!t)return toast('err','Note is empty','',1800);if(i==null)P.notes.push(t);else P.notes[i]=t;save();d._close();render()};d.querySelector('[data-fpsave]').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()}}
V.planner=plannerPage;
document.addEventListener('click',e=>{if(S.view!=='planner')return;const t=e.target;
 if(t.closest('[data-fpmatch]'))return fpMatch();if(t.closest('[data-fpbook]'))return fpBook();
 if(t.closest('[data-fpchange]'))return confirmDel('Change planner','Your booked session will be cancelled. Your notes stay.','Change',()=>{delete S.plan.session;S.plan.pl=null;save();render();fpMatch()});
 if(t.closest('[data-fpcancel]'))return confirmDel('Cancel session','Cancel your upcoming session?','Cancel session',()=>{delete S.plan.session;save();render();toast('ok','Session cancelled','',2000)});
 if(t.closest('[data-fpnadd]'))return fpNote(null);const ne=t.closest('[data-fpnedit]');if(ne)return fpNote(+ne.dataset.fpnedit);
 const nd=t.closest('[data-fpndel]');if(nd)return confirmDel('Delete note','Delete this note?','Delete',()=>{S.plan.notes.splice(+nd.dataset.fpndel,1);save();render()})});

document.addEventListener('click',e=>{if(e.target.closest('[data-gift]'))modal('Refer friends',`<div class="in" style="display:grid;gap:10px">${OB.refer().match(/<div class="promo">[\s\S]*?<\/div><\/div>/)[0]}<div class="how">${OB.refer().split('<div class="how">')[1].split('</div></div></div>')[0]}</div></div></div><button class="btn pri w" data-share>Refer your friends</button><div id="copy-note" class="note"></div></div>`)});

{const h=location.hash.slice(1);if(V[h]&&h!=='soon')S.view=h}
render();
</script>
